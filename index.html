
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deen Plus Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2ec;padding:10px}
.page{max-width:1100px;margin:auto;background:#fff;border-radius:16px;padding:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:60px;height:60px;border-radius:50%;background:#0b3d2e;color:#e8c268;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;border:3px solid #c9a94a;font-size:13px}
header h1{font-size:26px;color:#0b3d2e;line-height:1}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:12px;border:1px solid #ddd;border-radius:30px;outline:none}
.profile{position:relative;cursor:pointer}
.profile img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #c9a94a;display:block}
.profile span{position:absolute;bottom:-2px;right:-2px;background:#25D366;color:#fff;font-size:11px;padding:3px 6px;border-radius:20px}
.btn{padding:10px 16px;border-radius:30px;border:1.5px solid #0b3d2e;background:#fff;color:#0b3d2e;font-weight:700;cursor:pointer}
.btn.green{background:#0b5a3c;color:#fff;border:none}
.langbar{background:#0b3d2e;color:#fff;padding:10px;border-radius:10px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap;margin-top:12px}
.langbar button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 12px;border-radius:20px;cursor:pointer;font-weight:700}
.langbar button.active{background:#d4af37;color:#000}
.cats{display:flex;gap:8px;padding:12px 2px;overflow-x:auto;white-space:nowrap}
.cats button{padding:9px 14px;border:1px solid #ddd;border-radius:30px;background:#fff;cursor:pointer}
.cats button.active{background:#0b3d2e;color:#fff}
.hero{border-radius:14px;overflow:hidden;position:relative;background:#000;color:#fff;cursor:pointer}
.hero img,.hero video{width:100%;height:280px;object-fit:cover;display:block}
.htxt{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.vgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.vcard{border:1px solid #eee;border-radius:10px;overflow:hidden;cursor:pointer}
