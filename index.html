
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deen Plus Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6f6f2;padding:14px}
.wrap{max-width:1250px;margin:auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.08)}
/* HEADER */
header{display:flex;align-items:center;gap:18px;padding:16px 22px;flex-wrap:wrap}
.logo-box{display:flex;align-items:center;gap:12px}
.logo{width:62px;height:62px;border-radius:50%;background:#0b3d2e;color:#d4af37;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;line-height:1.1;border:3px solid #d4af37;font-size:14px}
.logo-box h1{font-size:32px;line-height:.95;color:#0b3d2e}
.search{flex:1;display:flex;justify-content:center}
.search input{width:100%;max-width:520px;padding:13px 20px 13px 42px;border-radius:30px;border:1px solid #ddd;font-size:15px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7' fill='none' stroke='%23888' stroke-width='2'/><line x1='16' y1='16' x2='21' y2='21' stroke='%23888' stroke-width='2'/></svg>") no-repeat 14px center;outline:none}
.top-btns{display:flex;align-items:center;gap:10px}
.sign{background:#fff;border:1px solid #0b3d2e;color:#0b3d2e;padding:10px 20px;border-radius:30px;font-weight:700;cursor:pointer}
.upload{background:#0b5a3c;color:#fff;border:none;padding:10px 20px;border-radius:30px;font-weight:700;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #ddd}
/* CATS */
.cats{display:flex;gap:10px;padding:4px 22px 16px;overflow-x:auto;white-space:nowrap}
.cats span{padding:10px 18px;border:1px solid #e5e5e5;border-radius:30px;font-size:14px;font-weight:600;background:#fff}
.cats span.active{background:#0b3d2e;color:#fff}
.cats i{color:red;font-style:normal}
/* MAIN */
.main{display:grid;grid-template-columns:1fr 340px;gap:18px;padding:0 22px 18px}
.card{border-radius:14px;overflow:hidden;position:relative;background:#000}
